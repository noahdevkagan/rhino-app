name: Build Check

# PRs run the same gate releases run (test-gate.yml via workflow_call), so
# there is exactly one CI build definition and it can't drift from releases.
# (This file used to carry its own build steps, pinned to macos-26 for the
# Apple Speech engine — that engine and the rust toolchain it installed were
# both deleted in the 0.1.0 80/20 cut.)
#
# No general per-push trigger: the local push gate covers development (this
# repo is private; macOS CI minutes bill at 10x). The one exception is
# claude/** branches — those are pushed from phone-driven Claude sessions on
# Linux containers, where the local push gate cannot run (no macOS), so CI is
# the only gate they have. Concurrency cancels superseded runs to keep the
# minutes bill bounded.
on:
  pull_request:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/test-gate.yml
