name: Improve weekly

# The loop that lets Rhino keep getting more accurate without anyone driving it:
# people who opted in to "Help improve accuracy" share their "Fix a word" pairs
# (CorrectionReporter.swift → rhinovoice.app/api/corrections). Once a week this
# reads the pairs taught on 3+ different Macs, merges the safe ones into the
# bundled OpenSuperWhisper/CommonCorrections.json (Scripts/improve), and opens a
# PR on claude/improve-<date>. A human reviews and merges; the next release ships
# it. Never auto-merges. decisions.md 2026-11-02.
#
# Needs repo secret RHINO_ADMIN_TOKEN (same value as the website Worker's
# ADMIN_TOKEN secret). Without it, or with nothing new, the run exits green.
on:
  schedule:
    - cron: "37 15 * * 1" # Mondays, 15:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: improve-weekly
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Script self-test
        run: python3 -m unittest Scripts/improve/test_merge_corrections.py

      - name: Fetch shared corrections (3+ Macs only)
        id: fetch
        env:
          ADMIN_TOKEN: ${{ secrets.RHINO_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::notice::RHINO_ADMIN_TOKEN is not set — nothing to fetch. Add it under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS --max-time 30 -H "Authorization: Bearer $ADMIN_TOKEN" \
            https://rhinovoice.app/api/admin/corrections-summary -o "$RUNNER_TEMP/summary.json"
          echo "pairs: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["pairs"]))' "$RUNNER_TEMP/summary.json")"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Merge into CommonCorrections.json
        id: merge
        if: steps.fetch.outputs.ready == 'true'
        run: |
          python3 Scripts/improve/merge_corrections.py \
            --summary "$RUNNER_TEMP/summary.json" \
            --bundle OpenSuperWhisper/CommonCorrections.json \
            --report "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="claude/improve-$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::$branch already exists — leaving it for review."
            exit 0
          fi
          git config user.name "rhino-improve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add OpenSuperWhisper/CommonCorrections.json
          git commit -m "Shared corrections: weekly update $(date -u +%Y-%m-%d)" \
                     -m "Pairs taught with \"Fix a word\" on 3+ Macs that opted in to Help improve accuracy. Generated by improve-weekly.yml."
          git push -u origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Shared corrections: weekly update $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          # Pushes made with the workflow token don't start other workflows, but a dispatch does:
          # run Build Check (the release test gate, incl. CommonCorrectionsTests) on the PR branch.
          gh workflow run build.yml --ref "$branch"
