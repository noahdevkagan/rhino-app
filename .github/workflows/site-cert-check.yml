# Temporary diagnostic: rhinovoice.app is reportedly serving an untrusted TLS
# cert (NET::ERR_CERT_AUTHORITY_INVALID). Session containers can't reach the
# site, so this checks the live cert from a GitHub runner. Delete after the
# incident is resolved.
name: Site cert check

on:
  push:
    branches: [claude/rhinovoice-website-issue-cagils]
  workflow_dispatch:

jobs:
  cert-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live certificate and content
        run: |
          for host in rhinovoice.app www.rhinovoice.app; do
            echo "=================== $host ==================="
            echo "--- leaf cert ---"
            echo | timeout 20 openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName \
              || echo "NO CERT RETURNED for $host"
            echo "--- verify result ---"
            echo | timeout 20 openssl s_client -connect "$host:443" -servername "$host" 2>&1 \
              | grep -E 'Verify return code' || echo "handshake failed for $host"
            echo "--- HTTPS status codes (verified) ---"
            for path in / /appsumo /thanks; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://$host$path" || echo "FAIL")
              echo "https://$host$path -> $code"
            done
          done
