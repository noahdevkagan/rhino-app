name: Test Gate

# A future release workflow should call this (workflow_call), so EVERY
# release runs the full test gate on CI before anything is published — the
# local pre-push gate can be skipped or unconfigured; this one cannot.
# workflow_dispatch lets you run the gate on demand without releasing.

# No per-push trigger: the local push gate covers development (this repo is
# private; macOS CI minutes bill at 10x). Release workflows MUST call this
# via workflow_call so nothing ships untested from any machine.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # rust was needed for the asian-autocorrect dylib, deleted in the 0.1.0
      # 80/20 cut along with its submodule — cmake + libomp are all that's left.
      - name: Toolchain
        run: brew install cmake libomp

      - name: Build
        run: |
          set -euo pipefail
          # Same build command as Scripts/push-gate.sh stage 1.
          ./run.sh build

      # Same invocation as Scripts/push-gate.sh stage 2 — change one, change
      # both. Reuses the Build step's derived data, so this only builds the
      # test bundle on top.
      - name: Unit tests
        run: |
          set -euo pipefail
          xcodebuild test -scheme OpenSuperWhisper -configuration Debug \
            -derivedDataPath build -quiet \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:OpenSuperWhisperTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Test suites
        run: |
          set -euo pipefail
          for runner in tests/*/run.sh; do
            [ -f "$runner" ] || continue
            bash "$runner"
          done
